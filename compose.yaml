services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-day_mendes_store}
      MYSQL_USER: ${DOCKER_DB_USER:-daymendes}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-daymendes_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-daymendes_root_local}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - 3306:3306
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot --password=$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: mariarocia/day-mendes-store-backend:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB_SERVER: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-day_mendes_store}
      DB_USER: ${DOCKER_DB_USER:-daymendes}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-daymendes_local}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-DayMendesStore}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-DayMendesStoreApp}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-2}
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 5114:8080

  frontend:
    image: mariarocia/day-mendes-store-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - 8080:80

volumes:
  mysql_data:
  uploads_data:
